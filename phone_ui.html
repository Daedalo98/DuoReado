<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DuoReado</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #1a1f36;
    --card-hi: #232a47;
    --text: #eef1fa;
    --muted: #8b94b3;
    --accent: #4ecca3;
    --danger: #e94560;
    --warn: #f7b731;
    --border: #2b3355;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }

  header {
    padding: 16px 18px 10px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  #status { font-size: 12px; color: var(--muted); }
  #status.online  { color: var(--accent); }
  #status.offline { color: var(--danger); }

  nav {
    display: flex; gap: 4px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 57px; background: var(--bg); z-index: 4;
  }
  nav button {
    flex: 1; padding: 10px; border-radius: 10px;
    background: transparent; color: var(--muted);
    border: 1px solid transparent; font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  nav button.active {
    background: var(--card); color: var(--text);
    border-color: var(--border);
  }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted);
       text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  select, input {
    width: 100%; padding: 12px; font-size: 16px;
    background: var(--card-hi); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    appearance: none;
  }

  button.primary, button.ghost, button.danger {
    width: 100%; padding: 14px; font-size: 16px;
    border-radius: 12px; border: none; font-weight: 600;
    cursor: pointer; margin-top: 10px;
  }
  button.primary { background: var(--accent); color: #051b15; }
  button.danger  { background: var(--danger); color: #fff; }
  button.ghost   { background: var(--card-hi); color: var(--text);
                   border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: default; }

  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > button { margin-top: 0; flex: 1; }

  /* --- Practice card --- */
  .word {
    font-size: 34px; font-weight: 700; text-align: center;
    margin: 8px 0 4px; word-break: break-word;
  }
  .word-meta { text-align: center; color: var(--muted); font-size: 13px; }
  .bar {
    height: 6px; background: var(--card-hi); border-radius: 3px;
    overflow: hidden; margin-top: 10px;
  }
  .bar > span { display: block; height: 100%; background: var(--accent); }

  .reveal { margin-top: 16px; }
  .reveal.hidden { display: none; }

  .translations { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .translations span {
    background: var(--card-hi); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 999px; font-size: 14px;
  }
  .explanation { color: var(--text); line-height: 1.5; font-size: 15px;
                 margin: 10px 0; }
  .edge-cases { margin: 8px 0 0; padding-left: 18px; color: var(--muted);
                font-size: 14px; line-height: 1.5; }
  .edge-cases li { margin-bottom: 4px; }

  .relation { color: var(--muted); font-size: 12px; }
  .form-row {
    display: flex; justify-content: space-between;
    align-items: baseline; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .form-row:last-child { border-bottom: none; }

  .example {
    background: var(--card-hi); border-radius: 10px; padding: 10px 12px;
    margin-top: 8px; font-size: 14px; line-height: 1.5;
  }
  .example .tr { color: var(--muted); margin-top: 4px; font-style: italic; }

  .feedback {
    text-align: center; color: var(--muted); font-size: 13px;
    margin-top: 12px; min-height: 18px;
  }

  /* --- Progress --- */
  .chapter-row { margin-bottom: 14px; }
  .chapter-head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 6px;
  }
  .chapter-head .title { font-size: 14px; }
  .chapter-head .score { font-size: 12px; color: var(--muted); }
  .readiness-bar { height: 8px; background: var(--card-hi);
                   border-radius: 4px; overflow: hidden; }
  .readiness-bar > span { display: block; height: 100%; }
  .ready  > span { background: var(--accent); }
  .medium > span { background: var(--warn); }
  .low    > span { background: var(--danger); }
  .chapter-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px;
           font-size: 15px; line-height: 1.6; }

  .pill {
    display: inline-block; padding: 2px 8px; font-size: 11px;
    border-radius: 999px; background: var(--card-hi); color: var(--muted);
    border: 1px solid var(--border);
  }
  .pill.learning { color: var(--warn); border-color: var(--warn); }
  .pill.mastered { color: var(--accent); border-color: var(--accent); }
  .pill.new      { color: var(--muted); }
  .pill.skipped  { color: #7a7f93; }
</style>
</head>
<body>

<header>
  <h1>DuoReado</h1>
  <span id="status">connecting…</span>
</header>

<nav>
  <button data-view="practice" class="active">Practice</button>
  <button data-view="progress">Progress</button>
  <button data-view="setup">Setup</button>
</nav>

<main>

  <!-- ============================= PRACTICE ============================= -->
  <section id="view-practice" class="view active">
    <div id="practice-empty" class="card empty">
      Pick a book and chapter in <b>Setup</b> to start practising.
    </div>

    <div id="practice-card" class="card" style="display:none">
      <div class="word" id="p-word">—</div>
      <div class="word-meta" id="p-meta"></div>
      <div class="bar"><span id="p-bar" style="width:0%"></span></div>

      <div id="p-reveal" class="reveal hidden"></div>

      <div class="row">
        <button id="p-reveal-btn" class="ghost">Reveal</button>
      </div>
      <div class="row" id="p-assess" style="display:none">
        <button id="p-bad"  class="danger">I didn't</button>
        <button id="p-good" class="primary">I knew it</button>
      </div>
      <div class="row">
        <button id="p-skip"   class="ghost">Skip word</button>
        <button id="p-enrich" class="ghost">Enrich with AI</button>
      </div>

      <div class="feedback" id="p-feedback"></div>
    </div>

    <div id="practice-done" class="card empty" style="display:none">
      <div style="font-size:32px">🎉</div>
      Session complete. Nice work!<br>
      <button id="p-again" class="primary" style="max-width:220px;margin:16px auto 0">
        Start another queue
      </button>
    </div>
  </section>

  <!-- ============================= PROGRESS ============================= -->
  <section id="view-progress" class="view">
    <div id="progress-empty" class="card empty">
      Load a book to see per-chapter progress.
    </div>
    <div id="progress-list"></div>
  </section>

  <!-- ============================== SETUP =============================== -->
  <section id="view-setup" class="view">
    <div class="card">
      <h2>Book</h2>
      <label for="s-book">Choose a book</label>
      <select id="s-book"></select>

      <label for="s-chapter">Chapter number</label>
      <input id="s-chapter" type="number" min="1" value="1">

      <label for="s-limit">Words in session</label>
      <input id="s-limit" type="number" min="1" max="100" value="20">

      <button id="s-start" class="primary" disabled>Load &amp; start</button>
      <div class="feedback" id="s-feedback"></div>
    </div>
  </section>

</main>

<script>
(() => {
  // ---------------------------------------------------------------- state
  const state = {
    books: [],
    book: null,        // {book_id, title, language}
    chapter: null,     // {number, title, total_words}
    user: null,
    queue: [],         // remaining lemmas
    queueSize: 0,
    current: null,     // current item payload from /api/session/next
    revealed: false,
    sessionActive: false,
  };

  const $ = (id) => document.getElementById(id);

  // ------------------------------------------------------------- transport
  async function apiGet(path) {
    const res = await fetch(path, { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
    return data;
  }
  async function apiPost(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
    return data;
  }

  function setStatus(text, cls) {
    const el = $("status");
    el.textContent = text;
    el.className = cls || "";
  }

  // -------------------------------------------------------------- nav/tabs
  document.querySelectorAll("nav button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      $(`view-${btn.dataset.view}`).classList.add("active");
      if (btn.dataset.view === "progress") loadProgress();
    });
  });

  // --------------------------------------------------------- setup: books
  async function loadBooks() {
    try {
      const data = await apiGet("/api/books");
      state.books = data.books || [];
      const sel = $("s-book");
      sel.innerHTML = "";
      if (state.books.length === 0) {
        sel.innerHTML = '<option value="">No books in data/books/</option>';
        $("s-start").disabled = true;
        return;
      }
      state.books.forEach((id) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        sel.appendChild(opt);
      });
      $("s-start").disabled = false;
      setStatus("online", "online");
    } catch (err) {
      setStatus("offline", "offline");
      $("s-feedback").textContent = `Bridge unreachable: ${err.message}`;
    }
  }

  async function startSession() {
    const bookId = $("s-book").value;
    const chapter = parseInt($("s-chapter").value, 10) || 1;
    const limit = parseInt($("s-limit").value, 10) || 20;
    if (!bookId) return;

    try {
      $("s-feedback").textContent = "Loading…";
      const sel = await apiPost("/api/select", { book_id: bookId, chapter_number: chapter });
      state.book = sel.state.book;
      state.chapter = sel.state.chapter;
      state.user = sel.state.user;

      const sess = await apiPost("/api/session/start", { limit });
      state.queue = sess.queue || [];
      state.queueSize = state.queue.length;
      state.sessionActive = true;
      $("s-feedback").textContent =
        `Loaded ${state.book.title} — chapter ${state.chapter.number}. Queue: ${state.queueSize}.`;

      // jump to practice tab
      document.querySelector('nav button[data-view="practice"]').click();
      renderPracticeShell();
      await nextWord();
    } catch (err) {
      $("s-feedback").textContent = `Error: ${err.message}`;
    }
  }

  // ------------------------------------------------------ practice: render
  function renderPracticeShell() {
    $("practice-empty").style.display = "none";
    $("practice-done").style.display = "none";
    $("practice-card").style.display = "block";
  }

  function renderItem(item) {
    state.current = item;
    state.revealed = false;

    $("p-word").textContent = item.lemma;
    const wk = item.knowledge || {};
    const status = wk.known_status || "new";
    const seen = wk.attempts || 0;
    const acc = ((wk.accuracy || 0) * 100).toFixed(0);
    $("p-meta").innerHTML =
      `<span class="pill ${status}">${status}</span> ` +
      `<span class="pill">${seen} attempts</span> ` +
      `<span class="pill">${acc}%</span>`;

    const remaining = state.queue.length;
    const done = state.queueSize - remaining - 1;
    $("p-bar").style.width =
      state.queueSize ? `${((done + 1) / state.queueSize) * 100}%` : "0%";

    $("p-reveal").classList.add("hidden");
    $("p-reveal").innerHTML = "";
    $("p-assess").style.display = "none";
    $("p-reveal-btn").disabled = false;
    $("p-reveal-btn").style.display = "block";
    $("p-feedback").textContent = "";
    $("p-enrich").disabled = !!item.is_enriched;
    $("p-enrich").textContent = item.is_enriched ? "Already enriched" : "Enrich with AI";
  }

  function buildRevealHtml(item) {
    const entry = item.entry || {};
    const entries = entry.entries || [];
    const linguistics = entry.linguistics || { explanation: "", edge_cases: [] };
    const examples = item.examples || [];

    let html = "";

    if (entries.length === 0) {
      html += `<div class="explanation" style="color:var(--muted)">
        No enriched data yet. Tap <b>Enrich with AI</b> below to generate
        translations and a linguistic explanation.
      </div>`;
    } else {
      // translations from every form entry, flattened, deduped
      const seen = new Set();
      const trs = [];
      entries.forEach((e) =>
        (e.translations || []).forEach((t) => {
          const k = t.toLowerCase();
          if (!seen.has(k)) { seen.add(k); trs.push(t); }
        })
      );
      if (trs.length) {
        html += `<div class="translations">${
          trs.map((t) => `<span>${escapeHtml(t)}</span>`).join("")
        }</div>`;
      }

      // forms + relations
      html += entries
        .map(
          (e) =>
            `<div class="form-row">
              <div><b>${escapeHtml(e.form)}</b></div>
              <div class="relation">${escapeHtml(e.relation)}</div>
            </div>`
        )
        .join("");

      // explanation
      if (linguistics.explanation) {
        html += `<div class="explanation">${escapeHtml(linguistics.explanation)}</div>`;
      }

      // edge cases
      const edges = linguistics.edge_cases || [];
      if (edges.length) {
        html += `<ul class="edge-cases">${
          edges.map((e) => `<li>${escapeHtml(e)}</li>`).join("")
        }</ul>`;
      }

      // semantic keywords
      const kws = entry.semantic_keywords || [];
      if (kws.length) {
        html += `<div class="translations" style="margin-top:12px">${
          kws.map((k) => `<span>#${escapeHtml(k)}</span>`).join("")
        }</div>`;
      }
    }

    // personalized examples
    if (examples.length) {
      html += `<h2 style="margin-top:18px">Examples</h2>`;
      html += examples
        .map(
          (ex) =>
            `<div class="example">
              ${escapeHtml(ex.sentence)}
              <div class="tr">${escapeHtml(ex.translation)}</div>
            </div>`
        )
        .join("");
    }

    return html;
  }

  async function nextWord() {
    if (state.queue.length === 0) {
      // ask the server once more — it may have more in a different chapter,
      // or it will return null to signal "done".
      try {
        const res = await apiGet("/api/session/next");
        if (!res.item) {
          showDone();
          return;
        }
        renderPracticeShell();
        renderItem(res.item);
        return;
      } catch (err) {
        showDone();
        return;
      }
    }

    try {
      const res = await apiGet("/api/session/next");
      if (!res.item) { showDone(); return; }
      // sync local queue count if server pushed something
      renderItem(res.item);
    } catch (err) {
      $("p-feedback").textContent = `Error: ${err.message}`;
    }
  }

  function showDone() {
    state.sessionActive = false;
    state.current = null;
    $("practice-card").style.display = "none";
    $("practice-empty").style.display = "none";
    $("practice-done").style.display = "block";
    // refresh progress in background
    loadProgress();
  }

  // --------------------------------------------------- practice: actions
  async function reveal() {
    if (!state.current) return;
    state.revealed = true;
    $("p-reveal").innerHTML = buildRevealHtml(state.current);
    $("p-reveal").classList.remove("hidden");
    $("p-assess").style.display = "flex";
    $("p-reveal-btn").style.display = "none";
  }

  async function answer(correct) {
    if (!state.current) return;
    try {
      const res = await apiPost("/api/session/answer", { correct });
      const wk = res.knowledge || {};
      $("p-feedback").textContent =
        `${correct ? "✓" : "✗"} ${res.lemma} — accuracy ${Math.round((wk.accuracy || 0) * 100)}%, status ${wk.known_status}`;
      state.queue.shift();
      setTimeout(nextWord, 450);
    } catch (err) {
      $("p-feedback").textContent = `Error: ${err.message}`;
    }
  }

  async function skipCurrent() {
    if (!state.current) return;
    try {
      await apiPost(`/api/word/${encodeURIComponent(state.current.lemma)}/skip`, {});
      state.queue.shift();
      await nextWord();
    } catch (err) {
      $("p-feedback").textContent = `Error: ${err.message}`;
    }
  }

  async function enrichCurrent() {
    if (!state.current) return;
    $("p-enrich").disabled = true;
    $("p-enrich").textContent = "Enriching…";
    try {
      const res = await apiPost(
        `/api/word/${encodeURIComponent(state.current.lemma)}/enrich`,
        {}
      );
      if (res.enriched) {
        // re-fetch full word payload
        const detail = await apiGet(`/api/word/${encodeURIComponent(state.current.lemma)}`);
        if (detail.word) {
          state.current = detail.word;
          if (state.revealed) {
            $("p-reveal").innerHTML = buildRevealHtml(state.current);
          }
        }
        $("p-enrich").textContent = "Enriched ✓";
      } else {
        $("p-enrich").textContent = "Enrich failed — retry";
        $("p-enrich").disabled = false;
      }
    } catch (err) {
      $("p-enrich").textContent = "Enrich failed — retry";
      $("p-enrich").disabled = false;
    }
  }

  // -------------------------------------------------------------- progress
  async function loadProgress() {
    try {
      const data = await apiGet("/api/progress");
      const chapters = data.chapters || [];
      const list = $("progress-list");
      if (chapters.length === 0) {
        $("progress-empty").style.display = "block";
        list.innerHTML = "";
        return;
      }
      $("progress-empty").style.display = "none";

      list.innerHTML = chapters
        .map((ch) => {
          const r = ch.readiness || {};
          const ratio = (r.readiness_ratio ?? 0) * 100;
          const cls = ratio >= 80 ? "ready" : ratio >= 40 ? "medium" : "low";
          const score = ch.score ? (ch.score.score ?? 0) : 0;
          return `
            <div class="card chapter-row">
              <div class="chapter-head">
                <span class="title">Ch. ${ch.number}${ch.title ? " — " + escapeHtml(ch.title) : ""}</span>
                <span class="score">score ${(score * 100).toFixed(0)}%</span>
              </div>
              <div class="readiness-bar ${cls}">
                <span style="width:${ratio.toFixed(1)}%"></span>
              </div>
              <div class="chapter-meta">
                ${r.ready_words ?? 0} known · ${r.learning_words ?? 0} learning · ${r.new_words ?? 0} new
                · ${ratio.toFixed(0)}% ready
              </div>
            </div>
          `;
        })
        .join("");
    } catch (err) {
      $("progress-empty").style.display = "block";
      $("progress-empty").textContent = `Progress unavailable: ${err.message}`;
    }
  }

  // ------------------------------------------------------------- helpers
  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------------------------------------------------------- wire-up
  $("s-start").addEventListener("click", startSession);
  $("p-reveal-btn").addEventListener("click", reveal);
  $("p-good").addEventListener("click", () => answer(true));
  $("p-bad").addEventListener("click", () => answer(false));
  $("p-skip").addEventListener("click", skipCurrent);
  $("p-enrich").addEventListener("click", enrichCurrent);
  $("p-again").addEventListener("click", async () => {
    // start a fresh queue with the same book/chapter
    try {
      const limit = parseInt($("s-limit").value, 10) || 20;
      const sess = await apiPost("/api/session/start", { limit });
      state.queue = sess.queue || [];
      state.queueSize = state.queue.length;
      state.sessionActive = true;
      $("practice-done").style.display = "none";
      renderPracticeShell();
      await nextWord();
    } catch (err) {
      $("p-feedback").textContent = `Error: ${err.message}`;
    }
  });

  // boot
  loadBooks();
})();
</script>
</body>
</html>
